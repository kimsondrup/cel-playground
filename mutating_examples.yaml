examples:
  - name: "Add a Default Label"
    category: "Apply Configuration"
    map: |
      apiVersion: admissionregistration.k8s.io/v1
      kind: MutatingAdmissionPolicy
      metadata:
        name: "add-managed-by-label"
      spec:
        # failurePolicy: how the apiserver reacts if this policy fails to
        # evaluate. Fail denies the request; Ignore skips this policy and lets
        # the rest of admission decide.
        # reinvocationPolicy: whether the mutation list may run more than once
        # if other policies also mutate the object (Never = run it once).
        failurePolicy: Fail
        reinvocationPolicy: Never
        matchConstraints:
          resourceRules:
          - apiGroups:   ["apps"]
            apiVersions: ["v1"]
            operations:  ["CREATE", "UPDATE"]
            resources:   ["deployments"]
        mutations:
        # ApplyConfiguration merges this fragment into the object with
        # server-side-apply semantics: the returned labels are added to the
        # existing ones, so the object's own "app" label is kept, not replaced.
        - patchType: ApplyConfiguration
          applyConfiguration:
            expression: >
              Object{
                metadata: Object.metadata{
                  labels: {"app.kubernetes.io/managed-by": "mutating-admission-policy"}
                }
              }

    dataOldObject: |

    dataObject: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: nginx
        namespace: default
        labels:
          app: nginx
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: nginx
        template:
          metadata:
            labels:
              app: nginx
          spec:
            containers:
            - name: nginx
              image: nginx:1.27

    dataNamespace: |

    dataRequest: |

    dataAuthorizer: |

  - name: "Inject a Sidecar Container"
    category: "Apply Configuration"
    map: |
      apiVersion: admissionregistration.k8s.io/v1
      kind: MutatingAdmissionPolicy
      metadata:
        name: "inject-sidecar"
      spec:
        failurePolicy: Fail
        # IfNeeded: if a later policy mutates the object, run this mutation
        # again so the injected sidecar is not lost. This is the recommended
        # setting for injection policies.
        reinvocationPolicy: IfNeeded
        matchConstraints:
          resourceRules:
          - apiGroups:   ["apps"]
            apiVersions: ["v1"]
            operations:  ["CREATE", "UPDATE"]
            resources:   ["deployments"]
        mutations:
        # A "native sidecar" is an initContainer with restartPolicy: Always
        # (Kubernetes 1.28+). initContainers has listType=map keyed by name, so
        # server-side-apply merges by name: the existing "setup" initContainer
        # is preserved and "mesh-proxy" is added alongside it.
        - patchType: ApplyConfiguration
          applyConfiguration:
            expression: >
              Object{
                spec: Object.spec{
                  template: Object.spec.template{
                    spec: Object.spec.template.spec{
                      initContainers: [
                        Object.spec.template.spec.initContainers{
                          name: "mesh-proxy",
                          image: "registry.example.com/mesh/proxy:v1.0.0",
                          restartPolicy: "Always"
                        }
                      ]
                    }
                  }
                }
              }

    dataOldObject: |

    dataObject: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: nginx
        namespace: default
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: nginx
        template:
          metadata:
            labels:
              app: nginx
          spec:
            initContainers:
            - name: setup
              image: busybox:1.36
            containers:
            - name: nginx
              image: nginx:1.27

    dataNamespace: |

    dataRequest: |

    dataAuthorizer: |

  - name: "Chained Mutations"
    category: "Apply Configuration"
    map: |
      apiVersion: admissionregistration.k8s.io/v1
      kind: MutatingAdmissionPolicy
      metadata:
        name: "propagate-part-of-label"
      spec:
        failurePolicy: Fail
        reinvocationPolicy: Never
        matchConstraints:
          resourceRules:
          - apiGroups:   ["apps"]
            apiVersions: ["v1"]
            operations:  ["CREATE", "UPDATE"]
            resources:   ["deployments"]
        mutations:
        # Mutation 1: stamp a recommended "part-of" label on the Deployment.
        - patchType: ApplyConfiguration
          applyConfiguration:
            expression: >
              Object{
                metadata: Object.metadata{
                  labels: {"app.kubernetes.io/part-of": "billing-system"}
                }
              }
        # Mutation 2: copy that label down onto the pod template. The `object`
        # binding here already reflects mutation 1 -- mutations run in order,
        # each one seeing the result of the previous.
        - patchType: ApplyConfiguration
          applyConfiguration:
            expression: >
              Object{
                spec: Object.spec{
                  template: Object.spec.template{
                    metadata: Object.spec.template.metadata{
                      labels: {
                        "app.kubernetes.io/part-of": object.metadata.labels["app.kubernetes.io/part-of"]
                      }
                    }
                  }
                }
              }

    dataOldObject: |

    dataObject: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: nginx
        namespace: default
        labels:
          app: nginx
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: nginx
        template:
          metadata:
            labels:
              app: nginx
          spec:
            containers:
            - name: nginx
              image: nginx:1.27

    dataNamespace: |

    dataRequest: |

    dataAuthorizer: |

  - name: "JSON Patch"
    category: "JSON Patch"
    map: |
      apiVersion: admissionregistration.k8s.io/v1
      kind: MutatingAdmissionPolicy
      metadata:
        name: "jsonpatch-remove-and-escape"
      spec:
        failurePolicy: Fail
        reinvocationPolicy: Never
        matchConstraints:
          resourceRules:
          - apiGroups:   ["apps"]
            apiVersions: ["v1"]
            operations:  ["CREATE", "UPDATE"]
            resources:   ["deployments"]
        mutations:
        # JSONPatch is for what ApplyConfiguration cannot express. Here:
        #   - "remove" deletes a field outright (an apply-configuration can only
        #     add or overwrite, never unset).
        #   - the second op adds a label whose key contains "/". In a JSON
        #     Pointer path "/" is the separator, so it must be escaped as "~1";
        #     jsonpatch.escapeKey() does that ("example.com/owner" -> "example.com~1owner").
        - patchType: JSONPatch
          jsonPatch:
            expression: >
              [
                JSONPatch{op: "remove", path: "/metadata/annotations/deprecated"},
                JSONPatch{
                  op: "add",
                  path: "/metadata/labels/" + jsonpatch.escapeKey("example.com/owner"),
                  value: "sre"
                }
              ]

    dataOldObject: |

    dataObject: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: nginx
        namespace: default
        labels:
          app: nginx
        annotations:
          deprecated: "true"
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: nginx
        template:
          metadata:
            labels:
              app: nginx
          spec:
            containers:
            - name: nginx
              image: nginx:1.27

    dataNamespace: |

    dataRequest: |

    dataAuthorizer: |

  - name: "Variables in Mutation"
    category: "Variables"
    map: |
      apiVersion: admissionregistration.k8s.io/v1
      kind: MutatingAdmissionPolicy
      metadata:
        name: "backfill-recommended-name"
      spec:
        failurePolicy: Fail
        reinvocationPolicy: Never
        matchConstraints:
          resourceRules:
          - apiGroups:   ["apps"]
            apiVersions: ["v1"]
            operations:  ["CREATE", "UPDATE"]
            resources:   ["deployments"]
        variables:
        # Compute a value once and reuse it below as variables.appName.
        # Rename the object's "app" label to something else and re-run: the
        # variable falls back to 'unknown'. The has() guard covers the other
        # shape, an object carrying no labels at all.
        - name: appName
          expression: "has(object.metadata.labels) && 'app' in object.metadata.labels ? object.metadata.labels['app'] : 'unknown'"
        mutations:
        # Backfill the recommended label app.kubernetes.io/name from the legacy
        # "app" label -- the mutation copies variables.appName, so the output
        # value is visibly the one the variable computed.
        - patchType: ApplyConfiguration
          applyConfiguration:
            expression: >
              Object{
                metadata: Object.metadata{
                  labels: {"app.kubernetes.io/name": variables.appName}
                }
              }

    dataOldObject: |

    dataObject: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: billing
        namespace: default
        labels:
          app: billing
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: billing
        template:
          metadata:
            labels:
              app: billing
          spec:
            containers:
            - name: billing
              image: nginx:1.27

    dataNamespace: |

    dataRequest: |

    dataAuthorizer: |

  - name: "Conditional Mutation"
    category: "Conditions"
    map: |
      apiVersion: admissionregistration.k8s.io/v1
      kind: MutatingAdmissionPolicy
      metadata:
        name: "default-tier-if-absent"
      spec:
        failurePolicy: Fail
        reinvocationPolicy: Never
        matchConstraints:
          resourceRules:
          - apiGroups:   ["apps"]
            apiVersions: ["v1"]
            operations:  ["CREATE", "UPDATE"]
            resources:   ["deployments"]
        # matchConditions gate the whole policy -- every mutation in it runs, or
        # none does. Use them for checks a label/namespace selector cannot
        # express. This one is a set-if-absent guard: only default the "tier"
        # label when it is missing.
        # Add `tier: <anything>` to the object's labels and re-run: the
        # condition becomes false, nothing is mutated, and the result says so.
        # To skip a single mutation while the others still run, have it return
        # an empty Object{}, or have a JSONPatch return an empty list from a
        # conditional: `cond ? [JSONPatch{...}] : []`. A bare [] does not
        # compile -- CEL cannot tell what an empty literal list holds.
        matchConditions:
        - name: tier-not-set
          expression: "!has(object.metadata.labels) || !('tier' in object.metadata.labels)"
        mutations:
        - patchType: ApplyConfiguration
          applyConfiguration:
            expression: >
              Object{
                metadata: Object.metadata{
                  labels: {"tier": "standard"}
                }
              }

    dataOldObject: |

    dataObject: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: nginx
        namespace: default
        labels:
          app: nginx
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: nginx
        template:
          metadata:
            labels:
              app: nginx
          spec:
            containers:
            - name: nginx
              image: nginx:1.27

    dataNamespace: |

    dataRequest: |

    dataAuthorizer: |

  - name: "Admission Context"
    category: "Context"
    map: |
      apiVersion: admissionregistration.k8s.io/v1
      kind: MutatingAdmissionPolicy
      metadata:
        name: "record-admission-context"
      spec:
        failurePolicy: Fail
        reinvocationPolicy: Never
        # UPDATE only: the mutation reads oldObject, which is null on CREATE.
        # Matching CREATE too would error here under failurePolicy: Fail.
        matchConstraints:
          resourceRules:
          - apiGroups:   ["apps"]
            apiVersions: ["v1"]
            operations:  ["UPDATE"]
            resources:   ["deployments"]
        mutations:
        # Every value comes from a different context binding available to a
        # policy -- one annotation per input tab, so the result reads as a
        # legend for what each binding holds.
        #
        # The reported cost dwarfs every other example's because of the
        # authorizer check: upstream prices one at ~350,000 of the 10,000,000
        # a single mutation may spend. Everything else here costs tens.
        - patchType: ApplyConfiguration
          applyConfiguration:
            expression: >
              Object{
                metadata: Object.metadata{
                  annotations: {
                    "playground.example.com/operation": string(request.operation),
                    "playground.example.com/changed-by": request.userInfo.username,
                    "playground.example.com/environment": namespaceObject.metadata.labels["environment"],
                    "playground.example.com/scaled-from": string(oldObject.spec.replicas),
                    "playground.example.com/may-scale": string(
                      authorizer.group("apps").resource("deployments").check("update").allowed()
                    )
                  }
                }
              }

    dataOldObject: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: nginx
        namespace: default
        labels:
          app: nginx
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: nginx
        template:
          metadata:
            labels:
              app: nginx
          spec:
            containers:
            - name: nginx
              image: nginx:1.27

    dataObject: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: nginx
        namespace: default
        labels:
          app: nginx
      spec:
        replicas: 5
        selector:
          matchLabels:
            app: nginx
        template:
          metadata:
            labels:
              app: nginx
          spec:
            containers:
            - name: nginx
              image: nginx:1.27

    dataNamespace: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: default
        labels:
          kubernetes.io/metadata.name: default
          environment: production

    dataRequest: |
      kind:
        group: "apps"
        version: "v1"
        kind: "Deployment"
      resource:
        group: "apps"
        version: "v1"
        resource: "deployments"
      name: "nginx"
      namespace: "default"
      operation: "UPDATE"
      userInfo:
        username: "alice"
        groups:
        - "system:authenticated"

    dataAuthorizer: |
      # The RBAC tab holds real rbac.authorization.k8s.io/v1 objects, and
      # Kubernetes' own RBAC authorizer answers the check above from them, for
      # the user the Request tab names. Remove the binding and re-run: the
      # may-scale annotation flips to "false", because RBAC has no way to say
      # no -- only to stay silent.
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: deployment-scaler
      rules:
        - apiGroups: ["apps"]
          resources: ["deployments"]
          verbs: ["update"]
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: alice-deployment-scaler
      subjects:
        - kind: User
          apiGroup: rbac.authorization.k8s.io
          name: alice
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: deployment-scaler
