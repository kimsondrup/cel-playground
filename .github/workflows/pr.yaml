name: validate
on:
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version: '>=1.26.0'
          cache: true

      - name: test
        run: make test

      # The oracle is a nested module, so `make test` does not reach it. Its
      # cluster-backed tests skip without envtest assets; the in-process ones,
      # which are the fence on every claim the evaluator makes about matching
      # the apiserver, run here.
      - name: differential oracle
        run: make test-oracle

      - name: check license headers
        run: make checklicense

      - name: build
        run: make build
