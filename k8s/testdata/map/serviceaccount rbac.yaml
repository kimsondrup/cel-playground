# Only the service account default/builder may update a deployment. Nothing
# grants it to the user making the request, so the two checks in
# "serviceaccount policy.yaml" answer differently.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: deployment-updater
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: builder-deployment-updater
subjects:
  - kind: ServiceAccount
    name: builder
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: deployment-updater
