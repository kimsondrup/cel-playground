apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: "patch-typo"
spec:
  failurePolicy: Fail
  mutations:
  - patchType: ApplyConfiguration
    applyConfiguration:
      # replicaz, not replicas: a cluster parses the patch against its own
      # schema and refuses the mutation. Object{} has no field checking, so
      # nothing catches this before it runs.
      expression: >
        Object{
          spec: Object.spec{
            replicaz: 3
          }
        }
