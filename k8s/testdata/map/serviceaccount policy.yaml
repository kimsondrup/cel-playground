apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: "service-account-authz"
spec:
  failurePolicy: Fail
  reinvocationPolicy: Never
  mutations:
  - patchType: ApplyConfiguration
    applyConfiguration:
      expression: >
        Object{
          metadata: Object.metadata{
            annotations: {
              "playground/sa-reason": authorizer.serviceAccount('default', 'builder').group('apps').resource('deployments').check('update').reason()
            }
          }
        }
