apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: "record-who-may-update"
spec:
  failurePolicy: Fail
  reinvocationPolicy: Never
  matchConstraints:
    resourceRules:
    - apiGroups:   ["apps"]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["deployments"]
  mutations:
  # authorizer.serviceAccount(namespace, name) asks the same question as the
  # user making the request, so the two answers only differ where RBAC grants
  # the verb to one of them.
  - patchType: ApplyConfiguration
    applyConfiguration:
      expression: >
        Object{
          metadata: Object.metadata{
            annotations: {
              "playground/requester-may-update":
                string(authorizer.group('apps').resource('deployments').check('update').allowed()),
              "playground/builder-may-update":
                string(authorizer.serviceAccount('default', 'builder').group('apps').resource('deployments').check('update').allowed())
            }
          }
        }
