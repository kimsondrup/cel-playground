apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    playground/can-update: "true"
    playground/old-replicas: "5"
    playground/operation: UPDATE
  labels:
    app: nginx
  name: nginx
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - image: nginx:1.27
        name: nginx
