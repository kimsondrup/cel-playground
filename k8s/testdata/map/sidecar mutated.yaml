apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - image: nginx:1.27
        name: nginx
      initContainers:
      - image: busybox:1.36
        name: setup
      - image: mesh-proxy:v1.0
        name: mesh-proxy
        restartPolicy: Always
