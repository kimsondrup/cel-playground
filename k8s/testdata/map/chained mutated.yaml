apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nginx
    step: one
    step-seen-by-second: one
  name: nginx
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - image: nginx:1.27
        name: nginx
