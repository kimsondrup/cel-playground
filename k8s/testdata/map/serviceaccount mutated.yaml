apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    playground/builder-may-update: "true"
    playground/requester-may-update: "false"
  labels:
    app: nginx
  name: nginx
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - image: nginx:1.27
        name: nginx
