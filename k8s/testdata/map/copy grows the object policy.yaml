apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: "copy-grows-the-object"
spec:
  failurePolicy: Ignore
  reinvocationPolicy: Never
  mutations:
  # Each copy puts /spec inside itself, so the document doubles per operation.
  # Twelve of them stay under the patch library's own copy limit and land just
  # past what a cluster would store.
  - patchType: JSONPatch
    jsonPatch:
      expression: '[JSONPatch{op: "copy", from: "/spec", path: "/spec/x0"}, JSONPatch{op: "copy", from: "/spec", path: "/spec/x1"}, JSONPatch{op: "copy", from: "/spec", path: "/spec/x2"}, JSONPatch{op: "copy", from: "/spec", path: "/spec/x3"}, JSONPatch{op: "copy", from: "/spec", path: "/spec/x4"}, JSONPatch{op: "copy", from: "/spec", path: "/spec/x5"}, JSONPatch{op: "copy", from: "/spec", path: "/spec/x6"}, JSONPatch{op: "copy", from: "/spec", path: "/spec/x7"}, JSONPatch{op: "copy", from: "/spec", path: "/spec/x8"}, JSONPatch{op: "copy", from: "/spec", path: "/spec/x9"}, JSONPatch{op: "copy", from: "/spec", path: "/spec/x10"}, JSONPatch{op: "copy", from: "/spec", path: "/spec/x11"}]'
