apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: "request-resource-subresource.example.com"
spec:
  failurePolicy: Fail
  validations:
  # The Request tab is a request for a subresource, so authorizer.requestResource
  # is a check on that subresource rather than on the resource holding it.
  - expression: 'authorizer.requestResource.check("update").reason()'
