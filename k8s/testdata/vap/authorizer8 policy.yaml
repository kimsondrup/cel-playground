apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: "authorizer-deny-and-error.example.com"
spec:
  failurePolicy: Fail
  validations:
  # An explicit deny: not allowed, and the reason the fixture gives for it.
  - expression: 'authorizer.group("apps").resource("deployments").check("update").allowed()'
  - expression: 'authorizer.group("apps").resource("deployments").check("update").reason()'
  # A decision that carries no error: errored() is false and error() is empty.
  - expression: 'authorizer.group("apps").resource("deployments").check("update").errored()'
  - expression: 'authorizer.group("apps").resource("deployments").check("update").error()'
  # A check the cluster could not answer: errored() is true, error() is the message,
  # and nothing about it is an allow.
  - expression: 'authorizer.group("apps").resource("deployments").check("delete").errored()'
  - expression: 'authorizer.group("apps").resource("deployments").check("delete").error()'
  - expression: 'authorizer.group("apps").resource("deployments").check("delete").allowed()'
  - expression: 'authorizer.group("apps").resource("deployments").check("delete").reason()'
  # A non-resource path can be denied with a reason too.
  - expression: 'authorizer.path("/healthz").check("get").allowed()'
  - expression: 'authorizer.path("/healthz").check("get").reason()'
