        groups:
          - system:authenticated
          - my-admin-group
        extra:
          some-key:
            - some-value1
            - some-value2

    dataAuthorizer: |
      # Nothing here grants "breakglass", so the check is not allowed and the
      # match condition holds: the webhook is called.
      #
      # This tab is read by Kubernetes' own RBAC authorizer, so it takes the
      # same Role, ClusterRole, RoleBinding and ClusterRoleBinding objects a
      # cluster does. The subject is request.userInfo.

    category: "RBAC"

  - name: "Authorizer Ignore breakglass"
    webhooks: |
      apiVersion: admissionregistration.k8s.io/v1
      kind: ValidatingWebhookConfiguration
      webhooks:
        - name: rbac.my-webhook.example.com
          matchPolicy: Equivalent
          rules:
            - operations: ['CREATE','UPDATE']
              apiGroups: ['apps']
              apiVersions: ['*']
              resources: ['*']
          failurePolicy: 'Fail' # Fail-closed (the default)
          sideEffects: None
          clientConfig:
            service:
              namespace: my-namespace
              name: my-webhook
            caBundle: 'PGNhYnVuZGxlPgo='
          # You can have up to 64 matchConditions per webhook
          matchConditions:
            - name: 'breakglass'
              # Skip requests made by users authorized to 'breakglass' on this webhook.
              # The 'breakglass' API verb does not need to exist outside this check.
              expression: '!authorizer.group("admissionregistration.k8s.io").resource("validatingwebhookconfigurations").name("rbac.my-webhook.example.com").check("breakglass").allowed()'

    dataOldObject: |

    dataObject: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        labels:
          app: kubernetes-bootcamp
        name: kubernetes-bootcamp
        namespace: default
      spec:
        progressDeadlineSeconds: 600
        replicas: 1
        revisionHistoryLimit: 10
        selector:
          matchLabels:
            app: kubernetes-bootcamp
        strategy:
          rollingUpdate:
            maxSurge: 25%
            maxUnavailable: 25%
          type: RollingUpdate
        template:
          metadata:
            creationTimestamp: null
            labels:
              app: kubernetes-bootcamp
          spec:
            containers:
            - image: gcr.io/google-samples/kubernetes-bootcamp:v1
              imagePullPolicy: IfNotPresent
              name: kubernetes-bootcamp
              resources: {}
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
            dnsPolicy: ClusterFirst
            restartPolicy: Always
            schedulerName: default-scheduler
            securityContext: {}
            terminationGracePeriodSeconds: 30

    dataRequest: |
      uid: 705ab4f5-6393-11e8-b7cc-42010a800002
      kind:
        group: apps
        version: v1
        kind: Deployment
      resource:
        group: apps
        version: v1
        resource: deployments
      requestKind:
        group: apps
        version: v1
        kind: Deployment
      requestResource:
        group: apps
        version: v1
        resource: deployments
      name: kubernetes-bootcamp
      namespace: default
      operation: CREATE
      userInfo:
        username: admin
        uid: 014fbff9a07c
        groups:
          - system:authenticated
          - my-admin-group
        extra:
          some-key:
            - some-value1
            - some-value2

    dataAuthorizer: |
      # "admin" is granted "breakglass" on this one webhook configuration, so
      # the check is allowed, the negated match condition is false, and the
      # webhook is skipped for this request.
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: webhook-breakglass
      rules:
        - apiGroups: ["admissionregistration.k8s.io"]
          resources: ["validatingwebhookconfigurations"]
          resourceNames: ["rbac.my-webhook.example.com"]
          verbs: ["breakglass"]
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: admin-webhook-breakglass
      subjects:
        - kind: User
          apiGroup: rbac.authorization.k8s.io
          name: admin
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: webhook-breakglass

    category: "RBAC"


  - name: "Custom Resource"
    webhooks: |
      apiVersion: admissionregistration.k8s.io/v1
      kind: ValidatingWebhookConfiguration
      webhooks:
        - name: cache-webhook.example.com
          matchPolicy: Equivalent
          rules:
            - operations: ['CREATE','UPDATE']
              apiGroups: ['example.com']
              apiVersions: ['v1']
              resources: ['caches']
          failurePolicy: 'Ignore'
          sideEffects: None
          clientConfig:
            service:
              namespace: my-namespace
              name: cache-webhook
            caBundle: 'PGNhYnVuZGxlPgo='
          matchConditions:
            # A matchCondition decides whether the webhook is called at all, and
            # it sees the request and the object as data -- so a custom resource
            # needs no schema and no CustomResourceDefinition to match on.
            - name: 'only-multi-replica-caches'
              expression: 'object.spec.replicas > 1'
            # request.resource is the group/version/resource the apiserver
            # actually routed, which is how you narrow to one custom type when
            # the rules above are broader.
            - name: 'only-caches'
              expression: 'request.resource.group == "example.com" && request.resource.resource == "caches"'
            - name: 'skip-controllers'
              expression: '!request.userInfo.username.startsWith("system:")'

    dataOldObject: |

    dataObject: |
      apiVersion: example.com/v1
      kind: Cache
      metadata:
        name: sessions
        namespace: default
      spec:
        eviction: "lru"
        replicas: 3

    dataRequest: |
      uid: 705ab4f5-6393-11e8-b7cc-42010a800002
      kind:
        group: example.com
        version: v1
        kind: Cache
      resource:
        group: example.com
        version: v1
        resource: caches
      requestKind:
        group: example.com
        version: v1
        kind: Cache
      requestResource:
        group: example.com
        version: v1
        resource: caches
      name: sessions
      namespace: default
      operation: CREATE
      userInfo:
        username: alice
        uid: 014fbff9a07c
        groups:
          - system:authenticated

    dataAuthorizer: |

    category: "Custom Resources"
